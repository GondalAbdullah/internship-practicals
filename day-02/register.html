<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Abdullah Ahmed</title>
  <meta name="description" content="Create an account on Abdullah Ahmed's site.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a href="#main">Skip to main content</a>

  <header>
    <p><a href="index.html">Abdullah Ahmed</a></p>
    <nav aria-label="Primary">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="register.html" aria-current="page">Register</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1>Create an account</h1>
    <p>All fields are required unless marked optional.</p>

    <form action="/register" method="post">
      <fieldset>
        <legend>Account</legend>
        <div>
          <label for="name">Full name</label>
          <input type="text" id="name" name="full_name" autocomplete="name" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password"
                 required minlength="8" aria-describedby="password-hint">
          <p id="password-hint">At least 8 characters.</p>
        </div>
      </fieldset>

      <fieldset>
        <legend>About you</legend>
        <div>
          <label for="phone">Mobile number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel"
                 required pattern="03[0-9]{9}" aria-describedby="phone-hint">
          <p id="phone-hint">11 digits starting with 03, e.g. 03001234567.</p>
        </div>
        <div>
          <label for="dob">Date of birth</label>
          <input type="date" id="dob" name="date_of_birth" autocomplete="bday" required>
        </div>
        <div>
          <label for="years">Years of experience (optional)</label>
          <input type="number" id="years" name="years_experience" min="0" max="40">
        </div>
        <div>
          <label for="github">GitHub URL (optional)</label>
          <input type="url" id="github" name="github_url" autocomplete="url">
        </div>
      </fieldset>

      <fieldset>
        <legend>Experience level</legend>
        <div>
          <input type="radio" id="student" name="level" value="student" required>
          <label for="student">Student</label>
        </div>
        <div>
          <input type="radio" id="graduate" name="level" value="graduate">
          <label for="graduate">Recent graduate</label>
        </div>
        <div>
          <input type="radio" id="professional" name="level" value="professional">
          <label for="professional">Working professional</label>
        </div>
      </fieldset>

      <div>
        <input type="checkbox" id="terms" name="accepted_terms" value="yes" required>
        <label for="terms">I agree to the terms of service</label>
      </div>

      <button type="submit">Create account</button>
    </form>
  </main>

  <footer>
    <p><small>&copy; <time datetime="2026">2026</time> Abdullah Ahmed</small></p>
  </footer>
</body>
</html>
